import net.fabricmc.loom.task.prod.ClientProductionRunTask
plugins {
    id 'fabric-loom' version '1.10.5'
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.6'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
}
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}
tasks.register('runCmobsClient', ClientProductionRunTask) {
    mods.setFrom(fileTree(providers.gradleProperty('cmobsRuntimeMods').get()) { include '*.jar' })
    runDir.set(file(providers.gradleProperty('cmobsClientRunDir').get()))
    def username = providers.gradleProperty('cmobsUsername').orElse('CMobsVisualCI').get()
    programArgs.addAll(['--username', username, '--width', '1280', '--height', '720'])
    def multiplayer = providers.gradleProperty('cmobsMultiplayer').orNull
    if (multiplayer != null) {
        programArgs.addAll(['--quickPlayMultiplayer', multiplayer])
        jvmArgs.addAll(['-Dcmobs.ci.posture=' + providers.gradleProperty('cmobsPostureCoordinator').get()])
    }
    outputs.upToDateWhen { false }
    useXVFB = false
}
