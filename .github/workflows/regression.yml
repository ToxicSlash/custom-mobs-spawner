name: CMobs regression
on:
  push:
    branches: [dev]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [full, build]
        default: full
permissions:
  contents: read
jobs:
  background:
    concurrency:
      group: cmobs-background-${{ github.ref }}
      cancel-in-progress: false
    needs: visual
    outputs:
      build_ok: ${{ steps.build.outcome }}
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Windows, "${{ vars.ADADV_BACKGROUND_RUNNER_LABEL || 'background' }}"]
    timeout-minutes: 45
    defaults:
      run:
        shell: cmd
    env:
      CMOBS_MOD_SOURCE: "${{ vars.CMOBS_MOD_SOURCE }}"
      ADADV_INSTANCE_PATH: "${{ vars.ADADV_INSTANCE_PATH }}"
      ADADV_CURSEFORGE_INSTANCE: "${{ vars.ADADV_CURSEFORGE_INSTANCE }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate installed Python
        id: locate_python
        run: |
          where py >nul 2>&1
          if not errorlevel 1 (
            py -3 -c "import sys; print(sys.executable)" > python-path.txt 2>nul
            if not errorlevel 1 goto found_python
          )
          where python >nul 2>&1
          if not errorlevel 1 (
            python -c "import sys; print(sys.executable)" > python-path.txt 2>nul
            if not errorlevel 1 goto found_python
          )
          for %%P in ("%LOCALAPPDATA%\Python\pythoncore-3.15-64\python.exe" "%LOCALAPPDATA%\Programs\Python\Python315\python.exe" "%LOCALAPPDATA%\Programs\Python\Python314\python.exe" "%LOCALAPPDATA%\Programs\Python\Python313\python.exe" "%LOCALAPPDATA%\Programs\Python\Python312\python.exe" "%LOCALAPPDATA%\Programs\Python\Python311\python.exe") do (
            if exist %%P (
              echo %%~P > python-path.txt
              goto found_python
            )
          )
          echo Installing portable Python in runner temporary directory
          set "PORTABLE=%RUNNER_TEMP%\cozy-python-3.11.9"
          if not exist "%PORTABLE%\python.exe" (
            curl.exe --fail --location --retry 3 https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip --output "%RUNNER_TEMP%\cozy-python.zip"
            if errorlevel 1 exit /b 1
            if not exist "%PORTABLE%" mkdir "%PORTABLE%"
            tar.exe -xf "%RUNNER_TEMP%\cozy-python.zip" -C "%PORTABLE%"
            if errorlevel 1 exit /b 1
          )
          "%PORTABLE%\python.exe" -c "import sys; print(sys.executable)" > python-path.txt
          if errorlevel 1 exit /b 1
          :found_python
          set /p PYTHON_EXE=<python-path.txt
          echo PYTHON_EXE=%PYTHON_EXE%>>"%GITHUB_ENV%"
          echo Using %PYTHON_EXE%
      - name: Resource and schema integrity
        id: resources
        run: '"%PYTHON_EXE%" -m unittest discover -s tests -v'
      - name: Import desktop-discovered dependency inputs
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        with:
          name: cmobs-desktop-inputs
          path: ci-desktop
      - name: Resolve pinned local integration jars
        id: deps
        if: ${{ !cancelled() && steps.locate_python.outcome == 'success' }}
        run: '"%PYTHON_EXE%" tools/prepare_ci.py'
      - name: Compile and package
        id: build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        shell: cmd
        run: gradlew.bat build --no-daemon --console=plain
      - name: Dedicated server and custom mob datapack smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.suite != 'build' }}
        run: '"%PYTHON_EXE%" tools/smoke_server.py'
      - name: Ice and Fire custom attributes and persistence
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.suite != 'build' }}
        run: '"%PYTHON_EXE%" tools/smoke_server.py --ice-and-fire'
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmobs-stage1-background
          path: |
            ci-output/
            build/libs/*.jar
          if-no-files-found: warn
  visual:
    concurrency:
      group: cmobs-desktop-${{ github.ref }}
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, "${{ vars.ADADV_VISUAL_RUNNER_LABEL || 'visual-test' }}"]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    env:
      CMOBS_MOD_SOURCE: "${{ vars.CMOBS_MOD_SOURCE }}"
      ADADV_INSTANCE_PATH: "${{ vars.ADADV_INSTANCE_PATH }}"
      ADADV_CURSEFORGE_INSTANCE: "${{ vars.ADADV_CURSEFORGE_INSTANCE }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify visual runner identity
        if: ${{ inputs.suite != 'build' }}
        run: |
          echo Runner: %RUNNER_NAME%
          powershell.exe -NoProfile -NonInteractive -Command "Write-Host ('Interactive session: ' + [Environment]::UserInteractive); if (-not [Environment]::UserInteractive) { exit 1 }"
          if errorlevel 1 exit /b 1
      - name: Locate installed Python
        id: locate_python
        run: |
          where py >nul 2>&1
          if not errorlevel 1 (
            py -3 -c "import sys; print(sys.executable)" > python-path.txt 2>nul
            if not errorlevel 1 goto found_python
          )
          where python >nul 2>&1
          if not errorlevel 1 (
            python -c "import sys; print(sys.executable)" > python-path.txt 2>nul
            if not errorlevel 1 goto found_python
          )
          for %%P in ("%LOCALAPPDATA%\Python\pythoncore-3.15-64\python.exe" "%LOCALAPPDATA%\Programs\Python\Python315\python.exe" "%LOCALAPPDATA%\Programs\Python\Python314\python.exe" "%LOCALAPPDATA%\Programs\Python\Python313\python.exe" "%LOCALAPPDATA%\Programs\Python\Python312\python.exe" "%LOCALAPPDATA%\Programs\Python\Python311\python.exe") do (
            if exist %%P (
              echo %%~P > python-path.txt
              goto found_python
            )
          )
          echo Installing portable Python in runner temporary directory
          set "PORTABLE=%RUNNER_TEMP%\cozy-python-3.11.9"
          if not exist "%PORTABLE%\python.exe" (
            curl.exe --fail --location --retry 3 https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip --output "%RUNNER_TEMP%\cozy-python.zip"
            if errorlevel 1 exit /b 1
            if not exist "%PORTABLE%" mkdir "%PORTABLE%"
            tar.exe -xf "%RUNNER_TEMP%\cozy-python.zip" -C "%PORTABLE%"
            if errorlevel 1 exit /b 1
          )
          "%PORTABLE%\python.exe" -c "import sys; print(sys.executable)" > python-path.txt
          if errorlevel 1 exit /b 1
          :found_python
          set /p PYTHON_EXE=<python-path.txt
          echo PYTHON_EXE=%PYTHON_EXE%>>"%GITHUB_ENV%"
          echo Using %PYTHON_EXE%
      - name: Discover local compile and runtime inputs as desktop user
        run: '"%PYTHON_EXE%" tools/prepare_ci.py --export'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmobs-desktop-inputs
          retention-days: 3
          path: ci-output/
          if-no-files-found: error

  client:
    concurrency:
      group: cmobs-desktop-${{ github.ref }}
      cancel-in-progress: false
    needs: [visual, background]
    if: ${{ !cancelled() && inputs.suite != 'build' && needs.background.outputs.build_ok == 'success' }}
    runs-on: [self-hosted, Windows, "${{ vars.ADADV_VISUAL_RUNNER_LABEL || 'visual-test' }}"]
    timeout-minutes: 35
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate installed Python
        id: locate_python
        run: |
          where py >nul 2>&1
          if not errorlevel 1 (
            py -3 -c "import sys; print(sys.executable)" > python-path.txt 2>nul
            if not errorlevel 1 goto found_python
          )
          where python >nul 2>&1
          if not errorlevel 1 (
            python -c "import sys; print(sys.executable)" > python-path.txt 2>nul
            if not errorlevel 1 goto found_python
          )
          for %%P in ("%LOCALAPPDATA%\Python\pythoncore-3.15-64\python.exe" "%LOCALAPPDATA%\Programs\Python\Python315\python.exe" "%LOCALAPPDATA%\Programs\Python\Python314\python.exe" "%LOCALAPPDATA%\Programs\Python\Python313\python.exe" "%LOCALAPPDATA%\Programs\Python\Python312\python.exe" "%LOCALAPPDATA%\Programs\Python\Python311\python.exe") do (
            if exist %%P (
              echo %%~P > python-path.txt
              goto found_python
            )
          )
          echo Installing portable Python in runner temporary directory
          set "PORTABLE=%RUNNER_TEMP%\cozy-python-3.11.9"
          if not exist "%PORTABLE%\python.exe" (
            curl.exe --fail --location --retry 3 https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip --output "%RUNNER_TEMP%\cozy-python.zip"
            if errorlevel 1 exit /b 1
            if not exist "%PORTABLE%" mkdir "%PORTABLE%"
            tar.exe -xf "%RUNNER_TEMP%\cozy-python.zip" -C "%PORTABLE%"
            if errorlevel 1 exit /b 1
          )
          "%PORTABLE%\python.exe" -c "import sys; print(sys.executable)" > python-path.txt
          if errorlevel 1 exit /b 1
          :found_python
          set /p PYTHON_EXE=<python-path.txt
          echo PYTHON_EXE=%PYTHON_EXE%>>"%GITHUB_ENV%"
          echo Using %PYTHON_EXE%
      - uses: actions/download-artifact@v4
        with:
          name: cmobs-stage1-background
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: cmobs-desktop-inputs
          path: ci-desktop
      - name: Production client title screen and framebuffer probe
        run: '"%PYTHON_EXE%" tools/smoke_client.py'
      - name: Dedicated two-client posture core regression
        if: ${{ !cancelled() }}
        run: '"%PYTHON_EXE%" tools/smoke_multiplayer.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmobs-stage1-client
          path: |
            ci-output/client/
            ci-output/multiplayer/
          if-no-files-found: warn
