plugins {
    id "fabric-loom" version "1.7-SNAPSHOT"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.willbl.dev/releases" }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.lwjgl") {
            details.useVersion "3.3.1"
            details.because "Minecraft 1.20.1 and Sodium 0.5.13 require LWJGL 3.3.1 in the dev runtime."
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation ("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation ("maven.modrinth:arrp:${project.arrp_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation ("maven.modrinth:libz:${project.libz_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation "com.github.apace100:autotag-api:${project.autotag_version}"
    modImplementation "com.github.apace100:autotag:${project.autotag_version}"
    modCompileOnly "maven.modrinth:mOgUt4GM:${project.mod_menu_version}"
    modCompileOnly ("maven.modrinth:rpgdifficulty:${project.rpgdifficulty_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    compileOnly files("run/mods/bettercombat-fabric-1.9.0+1.20.1.jar")
    compileOnly files("run/mods/rpgmana-1.1.0.jar")
    compileOnly files("run/mods/amethyst_core-1.5.0+1.20.1.jar")
    compileOnly files("run/mods/amethyst_imbuement-1.20.1-19.8.jar")
    compileOnly files("run/mods/fzzy_core-0.5.1+1.20.1.jar")
    compileOnly files("run/mods/fzzy_config-0.7.6+1.20.1.jar")
    modCompileOnly files("run/mods/Botania-1.20.1-453-FABRIC.jar")
    modCompileOnly files("run/mods/trinkets-3.7.2.jar")
    modCompileOnly files("run/mods/spell_engine-0.15.12+1.20.1.jar")
    modCompileOnly files("run/mods/spell_power-0.12.0+1.20.1.jar")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "cloth_config_version": project.cloth_config_version,
                "libz_version": project.libz_version,
                "autotag_version": project.autotag_version,
                "arrp_version": project.arrp_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// No external test framework needed for this deterministic packet-display contract.
tasks.register('postureDisplayRegression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.ashtonthedev.custommobsspawner.combat.PostureDisplaySnapshotTest'
}
tasks.named('check') { dependsOn tasks.named('postureDisplayRegression') }
